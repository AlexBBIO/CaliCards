<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 100 100">
  <!--
    Cali Coast Cards — holographic sticker, "Holo C" variant.
    The middle C is knocked out (true transparency) so the bare holographic
    material shows through as the rainbow C. Navy, gold, and red print solid
    with a white-ink underlay.
  -->
  <defs>
    <mask id="knock" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <!-- knock out the middle C... -->
      <path d="M 59.64 38.51 A 15 15 0 1 0 59.64 61.49" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
      <!-- ...but keep the area the red C paints over, so layering matches the logo -->
      <path d="M 82.64 38.51 A 15 15 0 1 0 82.64 61.49" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#knock)">
    <rect width="100" height="100" rx="23" fill="#232838"/>
    <path d="M 36.64 38.51 A 15 15 0 1 0 36.64 61.49" fill="none" stroke="#E2B437" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path d="M 82.64 38.51 A 15 15 0 1 0 82.64 61.49" fill="none" stroke="#D8433F" stroke-width="9" stroke-linecap="round"/>
</svg>
